      steps.push({ k: 'intro', b });
      b.items.forEach((it, i) => steps.push({ k: 'q', b, it, id: b.id + '_' + i }));
    });
    steps.push({ k: 'open' });
    return steps;
  }
  const questionSteps = () => buildSteps().filter(s => s.k === 'q');

  /* ---------- Router ---------- */
  function route() {
    window.scrollTo(0, 0);
    const h = location.hash;
    if (h.startsWith('#r=')) return renderShared(h.slice(3));
    if (h.startsWith('#comparar')) return renderCompareInput();
    if (S.done && S.profile) return renderResults();
    if (S.started) return renderStep();
    return renderIntro();
  }
  window.addEventListener('hashchange', route);

  /* =====================================================================

  function renderIntro() {

    const go = () => { if (!S.meta.sit) renderSetup(); else { S.started = true; save(); renderStep(); } };

  function heroArt() {

  /* =====================================================================
     CUESTIONARIO
     ===================================================================== */
  function renderStep() {
    const steps = buildSteps();
    if (S.step >= steps.length) S.step = steps.length - 1;
    if (S.step < 0) S.step = 0;
    const st = steps[S.step];
    const qs = steps.filter(s => s.k === 'q');
    const answered = qs.filter(q => S.answers[q.id]).length;
    const pct = Math.round(answered / qs.length * 100);
    const header = `<div class="qmeta"><span>${st.b ? esc(st.b.title) : 'Para cerrar'}</span><span>${answered} de ${qs.length}</span></div>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="Progreso"><div style="width:${pct}%"></div></div>`;

    if (st.k === 'intro') {
      const blocksAll = BLOCKS.filter(b => !b.optional || S.meta.social);
      const bi = blocksAll.indexOf(st.b) + 1;
      const showMonoHint = st.b.hintNonMono && (S.meta.est === 'abierta' || S.meta.est === 'otra');
      app.innerHTML = `${header}
      <div class="card fade" style="margin-top:14px">
        <div class="block-ic" aria-hidden="true">${st.b.icon}</div>
        <div class="eyebrow">Bloque ${bi} de ${blocksAll.length}</div>
        <h2>${esc(st.b.title)}</h2>
        <p>${esc(st.b.intro)}</p>
        ${showMonoHint ? `<p class="hint">${esc(st.b.hintNonMono)}</p>` : ''}
        ${S.meta.sit !== 'pareja' ? `<p class="hint">Cuando leas “mi pareja”, piensa en tu relación más reciente o significativa, o en cómo sueles ser en una relación.</p>` : ''}
        <p class="small muted">${st.b.items.length} preguntas · No hay respuestas correctas: contesta lo que más se parezca a ti hoy.</p>
        <div class="qnav">
          <button class="btn-link" id="prev">${S.step > 0 ? '← Atrás' : 'Salir'}</button>
          <button class="btn btn-primary" id="next">Empezar bloque</button>
        </div>
      </div>`;
      on('#next', () => go(1));
      on('#prev', () => S.step > 0 ? go(-1) : renderIntro());
      app.querySelector('#next').focus();
      return;
    }

    if (st.k === 'q') {
      const [dim, text] = st.it;
      const labels = SCALES[st.b.scale];
      const cur = S.answers[st.id];
      const n = qs.indexOf(st) + 1;
      app.innerHTML = `${header}
      <div class="card fade" style="margin-top:14px">
        <div class="eyebrow">Pregunta ${n}</div>
        <p class="qtext" id="qt">${esc(text)}</p>
        <div class="likert" role="radiogroup" aria-labelledby="qt">
          ${labels.map((l, i) => `<button type="button" role="radio" aria-checked="${cur === i + 1}" data-v="${i + 1}"><span class="k">${i + 1}</span>${esc(l)}</button>`).join('')}
        </div>
        <div class="qnav">
          <button class="btn-link" id="prev">← Atrás</button>
          <span class="small muted kbd-hint">Atajo: teclas 1–5</span>
          <button class="btn btn-ghost" id="next" ${cur ? '' : 'disabled'}>Siguiente →</button>
        </div>
      </div>
      <p class="small muted" style="text-align:center">Tu progreso se guarda automáticamente. <button class="btn-link" id="pause">Pausar y salir</button></p>`;
      app.querySelectorAll('.likert button').forEach(btn => btn.addEventListener('click', () => answer(st.id, +btn.dataset.v)));
      on('#prev', () => go(-1));
      on('#next', () => go(1));
      on('#pause', () => { toast('Progreso guardado'); renderIntro(); });
      const focusBtn = app.querySelector('.likert button[aria-checked="true"]') || app.querySelector('.likert button');
      focusBtn.focus({ preventScroll: true });
      return;
    }

    /* Preguntas abiertas */
    app.innerHTML = `${header}
    <div class="card fade" style="margin-top:14px">
      <div class="block-ic" aria-hidden="true">✍️</div>
      <div class="eyebrow">Para cerrar · opcional</div>
      <h2>En tus propias palabras</h2>
      <p class="muted">Estas respuestas aparecerán en tu reporte solo si las escribes. Al compartir, tú decides si incluirlas.</p>
      ${OPEN_QUESTIONS.map(q => `<div class="field" style="margin-bottom:16px"><label class="lbl" for="${q.id}">${esc(q.t)}</label><textarea id="${q.id}" maxlength="600">${esc(S.open[q.id] || '')}</textarea></div>`).join('')}
      <div class="qnav">
        <button class="btn-link" id="prev">← Atrás</button>
        <button class="btn btn-primary" id="finish">Ver mis resultados</button>
      </div>
    </div>`;
    app.querySelectorAll('textarea').forEach(t => t.addEventListener('input', () => { S.open[t.id] = t.value.slice(0, 600); save(); }));
    on('#prev', () => go(-1));
    on('#finish', finish);
  }

  function answer(id, v) {
    S.answers[id] = v; save();
    app.querySelectorAll('.likert button').forEach(b => b.setAttribute('aria-checked', String(+b.dataset.v === v)));
    const nx = app.querySelector('#next'); if (nx) nx.disabled = false;
    clearTimeout(answer._t); answer._t = setTimeout(() => go(1), 280);
  }
  function go(d) {
    clearTimeout(answer._t);
    const steps = buildSteps();
    const st = steps[S.step];
    if (d > 0 && st.k === 'q' && !S.answers[st.id]) return;
    S.step = Math.max(0, Math.min(steps.length - 1, S.step + d)); save(); renderStep();
    window.scrollTo(0, 0);
  }
  document.addEventListener('keydown', e => {
    if (!app.querySelector('.likert') || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    if (/^[1-5]$/.test(e.key)) { const b = app.querySelector(`.likert button[data-v="${e.key}"]`); if (b) b.click(); }
    if (e.key === 'ArrowLeft') go(-1);
    if (e.key === 'ArrowRight') { const nx = app.querySelector('#next'); if (nx && !nx.disabled) go(1); }
  });

  function finish() {
    const missing = questionSteps().filter(q => !S.answers[q.id]);
    if (missing.length) {
      const steps = buildSteps(); S.step = steps.indexOf(steps.find(s => s.id === missing[0].id)); save();
      toast(`Te faltan ${missing.length} preguntas por contestar`); renderStep(); return;
    }
    S.profile = computeProfile(); S.done = true; save();
    renderResults();
  }

  /* =====================================================================
     CÁLCULO DEL PERFIL
     Cada respuesta va de 1 a 5 (los ítems invertidos se calculan como 6 − respuesta).
     El puntaje de una dimensión es el promedio de sus ítems llevado a 0–100:
        puntaje = (promedio − 1) / 4 × 100
     ===================================================================== */
  function computeProfile() {
    const acc = {};
    questionSteps().forEach(q => {
      const v = S.answers[q.id]; if (!v) return;
      const [dim, , rev] = q.it;
      (acc[dim] = acc[dim] || []).push(rev ? 6 - v : v);
    });
    const s = {};
    Object.keys(acc).forEach(k => s[k] = clamp((avg(acc[k]) - 1) / 4 * 100));
    const P = {
      v: PAYLOAD_V, n: S.meta.name, d: new Date().toISOString().slice(0, 10), sit: S.meta.sit,
      sec: SECTIONS.map(x => x.id), s
    };
    derive(P);
    P.o = {}; OPEN_QUESTIONS.forEach(q => { if ((S.open[q.id] || '').trim()) P.o[q.id] = S.open[q.id].trim(); });
    return P;
  }

  /* Calcula radar, apego y listas a partir de los puntajes. */
  function derive(P) {
    const s = P.s;
    const val = p => p[0] === '-' ? (s[p.slice(1)] == null ? undefined : 100 - s[p.slice(1)]) : s[p];
    P.r = {}; RADAR_AXES.forEach(a => { const v = avg(a.parts.map(val)); if (v != null) P.r[a.id] = clamp(v); });
    const A = s.ansiedad, V = s.evitacion;
    P.a = { A, V, st: A > 50 && V > 50 ? 'temeroso' : A > 50 ? 'ansioso' : V > 50 ? 'evitativo' : 'seguro' };

    // Fortalezas: dimensiones 'good' altas o 'risk' bajas (sin anhelos ni heridas).
    const pool = Object.keys(DIMS).filter(k => s[k] != null && DIMS[k].pol !== 'info' && !['patrones', 'miedos'].includes(DIMS[k].sec) && k !== 'presion');
    const eff = k => DIMS[k].pol === 'good' ? s[k] : 100 - s[k];
    const sorted = pool.slice().sort((a, b) => eff(b) - eff(a));
    let f = sorted.filter(k => eff(k) >= 65).slice(0, 6);
    if (f.length < 3) f = sorted.slice(0, 3);
    P.f = f;
    let t = sorted.slice().reverse().filter(k => eff(k) < 50 && !f.includes(k)).slice(0, 6);
    if (!t.length) t = sorted.slice().reverse().filter(k => !f.includes(k)).slice(0, 2);
    P.t = t;

    // Para la pareja: las necesidades más relevantes de todas las dimensiones.
    const all = Object.keys(DIMS).filter(k => s[k] != null && DIMS[k].pol !== 'info' && DIMS[k].need);
    P.p = all.filter(k => eff(k) < 50).sort((a, b) => eff(a) - eff(b)).slice(0, 5);
    if (P.p.length < 2) P.p = all.sort((a, b) => eff(a) - eff(b)).slice(0, 2);

    const top = (prefix) => Object.keys(LOVE).map(k => [k, s[prefix + k]]).filter(x => x[1] != null).sort((a, b) => b[1] - a[1]);
    const an = SECTION_DIMS.anhelos.filter(k => s[k] != null).sort((a, b) => s[b] - s[a]);
    P.top = { lr: (top('lr_')[0] || [])[0], lg: (top('lg_')[0] || [])[0], an: an.slice(0, 3) };
    return P;
  }

  function helpFlags(P) {
    const s = P.s, flags = [];
    if (s.ansiedad >= 75) flags.push('ansiedad en el vínculo');
    if (s.verguenza >= 70) flags.push('sensación de vergüenza o defecto');
    if (s.privacion >= 70) flags.push('privación emocional');
    if (s.valia != null && s.valia <= 25) flags.push('valía personal');
    if (s.regulacion != null && s.regulacion <= 25) flags.push('regulación emocional');
    if (s.abandono >= 80) flags.push('miedo al abandono');
    return flags;
  }

  /* =====================================================================
     COMPONENTES VISUALES
     ===================================================================== */
  function bar(score, pol, color) {
    const c = color || (pol === 'info' ? 'var(--rose)' : (pol === 'good' ? (score >= 65 ? 'var(--sage)' : score >= 35 ? 'var(--amber)' : 'var(--accent)') : (score >= 65 ? 'var(--accent)' : score >= 35 ? 'var(--amber)' : 'var(--sage)')));
    return `<div class="bar" aria-hidden="true"><div style="width:${Math.max(3, score)}%;background:${c}"></div></div>`;
  }
  function tag(score, pol) {
    const l = lvl(score);
    const label = { low: 'Bajo', mid: 'Medio', high: 'Alto' }[l];
    let cls = 'mid';
    if (pol === 'good') cls = l === 'high' ? 'good' : l === 'low' ? 'bad' : 'mid';
    if (pol === 'risk') cls = l === 'high' ? 'bad' : l === 'low' ? 'good' : 'mid';
    return `<span class="tag ${cls}">${label} · ${score}</span>`;
  }
  function isConcern(k, score) { const d = DIMS[k]; return d.pol === 'risk' ? score >= 50 : d.pol === 'good' ? score < 50 : false; }
  function dimBlock(k, score, opts = {}) {
    const d = DIMS[k]; if (!d || score == null) return '';
    const showEx = opts.ex !== false && d.ex && isConcern(k, score);
    return `<div class="dim">
      <div class="dim-h"><strong>${esc(d.name)}</strong>${tag(score, d.pol)}</div>
      ${bar(score, d.pol)}
      <p style="margin:0">${esc(d[lvl(score)])}</p>
      ${showEx ? `<details class="more" ${opts.open ? 'open' : ''}><summary>Ejercicios para trabajarlo</summary><ul class="ex">${d.ex.map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>` : ''}
    </div>`;
  }

  function radarSVG(series) {
    const N = RADAR_AXES.length, cx = 200, cy = 175, R = 120;
    const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / N; return [cx + Math.cos(a) * R * v / 100, cy + Math.sin(a) * R * v / 100]; };
    let g = '';
    [25, 50, 75, 100].forEach(lv => { g += `<polygon points="${RADAR_AXES.map((_, i) => pt(i, lv).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`; });
    RADAR_AXES.forEach((a, i) => {
      const [x, y] = pt(i, 100); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
      const [lx, ly] = pt(i, 122); const anchor = Math.abs(lx - cx) < 10 ? 'middle' : lx > cx ? 'start' : 'end';
      const words = a.name.split(' '); const lines = words.length > 2 ? [words.slice(0, 2).join(' '), words.slice(2).join(' ')] : words.length === 2 && a.name.length > 14 ? words : [a.name];
      g += `<text x="${lx}" y="${ly - (lines.length - 1) * 7 + 4}" text-anchor="${anchor}" font-size="15" fill="var(--muted)">${lines.map((l, j) => `<tspan x="${lx}" dy="${j ? 17 : 0}">${esc(l)}</tspan>`).join('')}</text>`;
    });
    series.forEach(sr => {
      const pts = RADAR_AXES.map((a, i) => pt(i, sr.r[a.id] == null ? 0 : sr.r[a.id]));
      g += `<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="${sr.color}" fill-opacity=".18" stroke="${sr.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
      g += pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${sr.color}"/>`).join('');
    });
    const desc = series.map(sr => sr.label + ': ' + RADAR_AXES.map(a => `${a.name} ${sr.r[a.id] ?? '—'}`).join(', ')).join('. ');
    return `<div class="radar-wrap"><svg viewBox="-60 0 520 350" role="img" aria-label="Gráfica radar. ${esc(desc)}">${g}</svg></div>`;
  }

  function attachSVG(points) {
    const S0 = 200, pad = 20, inner = S0 - pad * 2;
    const X = v => pad + inner * v / 100, Y = v => pad + inner * (1 - v / 100);
    let g = `<rect x="${pad}" y="${pad}" width="${inner}" height="${inner}" rx="10" fill="var(--surface-2)"/>
      <line x1="${X(50)}" y1="${pad}" x2="${X(50)}" y2="${pad + inner}" stroke="var(--line)" stroke-dasharray="4 4"/>
      <line x1="${pad}" y1="${Y(50)}" x2="${pad + inner}" y2="${Y(50)}" stroke="var(--line)" stroke-dasharray="4 4"/>
      <text x="${pad + 8}" y="${pad + inner - 8}" font-size="11" fill="var(--muted)">Seguro</text>
      <text x="${pad + inner - 8}" y="${pad + inner - 8}" text-anchor="end" font-size="11" fill="var(--muted)">Ansioso</text>
      <text x="${pad + 8}" y="${pad + 16}" font-size="11" fill="var(--muted)">Evitativo</text>
      <text x="${pad + inner - 8}" y="${pad + 16}" text-anchor="end" font-size="11" fill="var(--muted)">Temeroso</text>
      <text x="${S0 / 2}" y="${S0 - 3}" text-anchor="middle" font-size="10" fill="var(--muted)">Ansiedad →</text>
      <text x="9" y="${S0 / 2}" text-anchor="middle" font-size="10" fill="var(--muted)" transform="rotate(-90 9 ${S0 / 2})">Evitación →</text>`;
    points.forEach(p => { g += `<circle cx="${X(p.A)}" cy="${Y(p.V)}" r="9" fill="${p.color}" stroke="var(--surface)" stroke-width="3"/>`; });
    return `<svg viewBox="0 0 ${S0} ${S0}" role="img" aria-label="Mapa de apego: ${points.map(p => `${esc(p.label)} ansiedad ${p.A}, evitación ${p.V}`).join('; ')}">${g}</svg>`;
  }

  /* =====================================================================
     SECCIONES DEL REPORTE
     ===================================================================== */
  const ICONS = { resumen: '🧭', fortalezas: '🌱', trabajar: '🛠️', miedos: '🌧️', inseguridades: '🪞', heridas: '🧵', anhelos: '✨', amor: '💞', conflicto: '⚡', pareja: '🤝', abiertas: '✍️' };
  const secWrap = (id, title, body, intro) => `<section class="card fade" id="sec-${id}" data-sec="${id}">
    <div class="sec-title"><span class="ic" aria-hidden="true">${ICONS[id]}</span><h2>${esc(title)}</h2></div>
    ${intro ? `<p class="muted">${intro}</p>` : ''}${body}</section>`;

  function secResumen(P, own) {
    if (!P.r || !P.a || P.a.A == null) return '';
    const st = ATTACHMENT[P.a.st] || ATTACHMENT.seguro;
    return secWrap('resumen', own ? 'Tu mapa en una mirada' : 'Su mapa en una mirada', `
      ${radarSVG([{ r: P.r, color: 'var(--accent)', label: P.n || 'Perfil' }])}
      <p class="small muted" style="text-align:center">Cada eje va de 0 (centro) a 100 (borde). Más hacia afuera indica más recursos en esa área.</p>
      <hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
      <div class="att">
        ${attachSVG([{ A: P.a.A, V: P.a.V, color: 'var(--accent)', label: P.n || 'Perfil' }])}
        <div>
          <div class="eyebrow">Estilo de apego predominante</div>
          <div class="big-badge"><span aria-hidden="true">${st.emoji}</span> ${esc(st.name)}</div>
          <p style="margin-top:12px">${esc(st.text)}</p>
          <p class="small muted">Ansiedad ${P.a.A} · Evitación ${P.a.V}. El apego no es una etiqueta fija: cambia con la experiencia, el autoconocimiento y las relaciones seguras.</p>
        </div>
      </div>`);
  }

  function secFortalezas(P, own) {
    if (!P.f || !P.f.length) return '';
    const body = `<ul class="list-plain">${P.f.filter(k => DIMS[k] && P.s[k] != null).map(k => `<li><span aria-hidden="true">✓</span><div><strong>${esc(DIMS[k].name)}</strong><div>${esc(DIMS[k].plus)}</div></div></li>`).join('')}</ul>
      ${own ? `<p class="small muted" style="margin-top:12px">Estas fortalezas son recursos que ya tienes. Úsalas como punto de apoyo para trabajar lo demás.</p>` : ''}`;
    return secWrap('fortalezas', own ? 'Tus puntos fuertes' : 'Sus puntos fuertes', body, own ? 'Lo que ya aportas a una relación.' : '');
  }

  function secTrabajar(P, own) {
    if (!P.t || !P.t.length) return '';
    const body = P.t.filter(k => DIMS[k] && P.s[k] != null).map(k => dimBlock(k, P.s[k], { open: true })).join('');
    return secWrap('trabajar', own ? 'Tus áreas a trabajar' : 'Sus áreas a trabajar', body, 'No son defectos: son las áreas donde un pequeño cambio puede hacer una gran diferencia.');
  }

  function secList(id, title, intro, P) {
    const keys = (SECTION_DIMS[id] || []).filter(k => P.s[k] != null);
    if (!keys.length) return '';
    return secWrap(id, title, keys.map(k => dimBlock(k, P.s[k])).join(''), intro);
  }

  function secHeridas(P, own) {
    const keys = SECTION_DIMS.heridas.filter(k => P.s[k] != null);
    if (!keys.length) return '';
    const sorted = keys.slice().sort((a, b) => P.s[b] - P.s[a]);
    return secWrap('heridas', 'Heridas y patrones', `
      <div class="note small" style="margin-bottom:10px">Esto no es un diagnóstico de trauma. Son patrones aprendidos, inspirados en la terapia de esquemas, que suelen venir de experiencias tempranas. Tenerlos es humano; reconocerlos es el primer paso para que pierdan fuerza.</div>
      ${sorted.map(k => dimBlock(k, P.s[k])).join('')}`);
  }

  function secAnhelos(P, own) {
    const keys = SECTION_DIMS.anhelos.filter(k => P.s[k] != null).sort((a, b) => P.s[b] - P.s[a]);
    if (!keys.length) return '';
    const top = keys.slice(0, 3).map(k => DIMS[k].name.toLowerCase());
    return secWrap('anhelos', own ? 'Lo que anhelas' : 'Lo que anhela', `
      <p class="quote">Lo más importante ${own ? 'para ti' : ''} en una relación: ${esc(top.join(', ').replace(/, ([^,]*)$/, ' y $1'))}.</p>
      ${keys.map(k => `<div class="dim"><div class="dim-h"><strong>${esc(DIMS[k].name)}</strong><span class="small muted">${P.s[k]}</span></div>${bar(P.s[k], 'info')}<div class="small muted">${esc(DIMS[k].d)}</div></div>`).join('')}
      ${own ? `<p class="small muted" style="margin-top:12px">Los anhelos no se califican: muestran lo que buscas. Compararlos con los de tu pareja ayuda a ver dónde coinciden y qué conviene conversar.</p>` : ''}`);
  }

  function secAmor(P, own) {
    const rows = Object.keys(LOVE).filter(k => P.s['lr_' + k] != null || P.s['lg_' + k] != null);
    if (!rows.length) return '';
    const sortR = rows.slice().sort((a, b) => (P.s['lr_' + b] || 0) - (P.s['lr_' + a] || 0));
    const topR = sortR[0];
    const topG = rows.slice().sort((a, b) => (P.s['lg_' + b] || 0) - (P.s['lg_' + a] || 0))[0];
    const mismatch = topR !== topG;
    return secWrap('amor', own ? 'Cómo das y recibes amor' : 'Cómo da y recibe amor', `
      <div class="legend"><span style="--c:var(--rose)">Cómo ${own ? 'te gusta' : 'le gusta'} recibir</span><span style="--c:var(--sage)">Cómo ${own ? 'sueles' : 'suele'} dar</span></div>
      ${sortR.map(k => `<div class="dim"><div class="dim-h"><strong>${esc(LOVE[k].name)}</strong><span class="small muted">recibir ${P.s['lr_' + k] ?? '—'} · dar ${P.s['lg_' + k] ?? '—'}</span></div>
        ${bar(P.s['lr_' + k] || 0, 'info', 'var(--rose)')}<div class="bar b2" aria-hidden="true"><div style="width:${Math.max(3, P.s['lg_' + k] || 0)}%;background:var(--sage)"></div></div></div>`).join('')}
      <p style="margin-top:12px">${own ? 'Te sientes' : 'Se siente'} más querida o querido con <strong>${esc(LOVE[topR].receive)}</strong>.
      ${mismatch ? `Curiosamente, ${own ? 'tu' : 'su'} forma más natural de dar amor es otra: <strong>${esc(LOVE[topG].name.toLowerCase())}</strong>. Es común dar el amor como nos gustaría recibirlo… o como lo aprendimos. Vale la pena que la pareja lo sepa.` : `Además, ${own ? 'sueles' : 'suele'} dar amor de esa misma forma.`}</p>
      <p class="small muted">Referencia: “lenguajes del amor” (Chapman). Úsalos como herramienta de conversación, no como verdad científica.</p>`);
  }

  function secConflicto(P, own) {
    const keys = SECTION_DIMS.conflicto.filter(k => P.s[k] != null);
    if (!keys.length) return '';
    const horsemen = ['critica', 'defensa', 'desprecio', 'evasion'].filter(k => P.s[k] != null);
    const worst = horsemen.sort((a, b) => P.s[b] - P.s[a])[0];
    const antidote = { critica: 'el inicio suave (hablar de lo que sientes y necesitas, no de cómo es la otra persona)', defensa: 'asumir la responsabilidad de tu parte, aunque sea pequeña', desprecio: 'construir una cultura de aprecio y gratitud', evasion: 'pedir una pausa, calmarte y regresar a la conversación' };
    return secWrap('conflicto', own ? 'Cómo manejas el conflicto' : 'Cómo maneja el conflicto', `
      <p class="muted">Gottman describe cuatro patrones que desgastan una relación (crítica, actitud defensiva, desprecio y evasión) y dos habilidades que la protegen (reparar y regularse).</p>
      ${keys.map(k => dimBlock(k, P.s[k])).join('')}
      ${worst && P.s[worst] >= 35 ? `<div class="note sage small" style="margin-top:12px"><strong>Tu antídoto principal:</strong> en tu caso, el patrón más presente es “${esc(DIMS[worst].name.toLowerCase())}”. Su antídoto es ${esc(antidote[worst])}.</div>` : ''}`);
  }

  function secPareja(P, own) {
    if (!P.p && !P.top && !P.a) return '';
    const st = P.a && P.a.st ? ATTACHMENT[P.a.st] : null;
    const needs = [];
    if (st) needs.push(st.need);
    if (P.top && P.top.lr && LOVE[P.top.lr]) needs.push(`Lo que más me llena es ${LOVE[P.top.lr].receive}.`);
    if (P.top && P.top.lg && P.top.lr && P.top.lg !== P.top.lr && LOVE[P.top.lg]) needs.push(`Mi forma más natural de demostrar amor es con ${LOVE[P.top.lg].name.toLowerCase()}; si a veces no lo notas, fíjate ahí.`);
    if (P.top && P.top.an && P.top.an.length) needs.push(`Lo que más busco en una relación: ${P.top.an.filter(k => DIMS[k]).map(k => DIMS[k].name.toLowerCase()).join(', ').replace(/, ([^,]*)$/, ' y $1')}.`);
    (P.p || []).forEach(k => { if (DIMS[k] && DIMS[k].need) needs.push(DIMS[k].need); });
    const helps = [];
    if (P.top && P.top.lr && LOVE[P.top.lr]) helps.push(LOVE[P.top.lr].help);
    (P.p || []).forEach(k => { if (DIMS[k] && DIMS[k].help) helps.push(DIMS[k].help); });
    if (!needs.length) return '';
    return secWrap('pareja', own ? 'Lo que tu pareja debería saber de ti' : 'Lo que quiere que sepas', `
      ${own ? '<p class="muted">Escrito en primera persona para que puedas compartirlo tal cual. Habla de necesidades, no de reproches.</p>' : ''}
      <ul class="list-plain">${needs.map(n => `<li><span aria-hidden="true">💬</span><div>${esc(n)}</div></li>`).join('')}</ul>
      <h3 style="margin-top:22px">Cómo puedes acompañarme</h3>
      <ul class="list-plain">${helps.map(n => `<li><span aria-hidden="true">🤲</span><div>${esc(n)}</div></li>`).join('')}</ul>`);
  }

  function secAbiertas(P, own) {
    const items = OPEN_QUESTIONS.filter(q => P.o && P.o[q.id]);
    if (!items.length) return '';
    return secWrap('abiertas', own ? 'En tus propias palabras' : 'En sus propias palabras', items.map(q => `<div class="dim"><strong>${esc(q.t)}</strong><p class="quote" style="white-space:pre-wrap">${esc(P.o[q.id])}</p></div>`).join(''));
  }

  function renderSections(P, own) {
    const has = id => P.sec.includes(id);
    const map = {
      resumen: secResumen, fortalezas: secFortalezas, trabajar: secTrabajar,
      miedos: (P, o) => secList('miedos', o ? 'Tus miedos' : 'Sus miedos', 'Los miedos son mensajes de partes de ti que quieren protegerte. Conocerlos te permite decidir, en lugar de reaccionar.', P),
      inseguridades: (P, o) => secList('inseguridades', o ? 'Tus inseguridades' : 'Sus inseguridades', 'Cómo te ves dentro de una relación y qué tanto depende eso de los demás.', P),
      heridas: secHeridas, anhelos: secAnhelos, amor: secAmor, conflicto: secConflicto, pareja: secPareja, abiertas: secAbiertas
    };
    return SECTIONS.filter(x => has(x.id)).map(x => ({ id: x.id, name: x.name, html: map[x.id](P, own) })).filter(x => x.html);
  }

  /* =====================================================================
     RESULTADOS PROPIOS
     ===================================================================== */
  function renderResults() {
    const P = S.profile;
    const secs = renderSections(P, true);
    const flags = helpFlags(P);
    const pending = store.get(PENDING_KEY);
    app.innerHTML = `
      <div class="fade">
        <div class="eyebrow">Tus resultados · ${esc(fmtDate(P.d))}</div>
        <h1>${P.n ? 'El mapa de ' + esc(P.n) : 'Tu mapa'}</h1>
        <p class="muted">Lee con calma y con amabilidad hacia ti. Nada de esto te define para siempre: es una fotografía de hoy.</p>
        <div class="toolbar">
          <button class="btn btn-primary" id="share">Compartir con mi pareja</button>
          <button class="btn btn-ghost" id="print">Guardar PDF</button>
          <button class="btn btn-ghost" id="cmp">Comparar resultados</button>
          <button class="btn btn-ghost" id="redo">Volver a hacerlo</button>
        </div>
        ${pending ? `<div class="shared-banner no-print"><strong>¿Comparar con ${esc(pending.n || 'tu pareja')}?</strong><p class="small" style="margin:4px 0 10px">Abriste sus resultados antes de hacer el cuestionario. Ya puedes compararlos.</p><button class="btn btn-primary" id="cmpPending">Comparar ahora</button></div>` : ''}
        ${flags.length ? `<div class="card soft"><div class="note"><strong>Un cuidado especial para ti.</strong> Algunos resultados salieron altos (${esc(flags.join(', '))}). No significa que algo esté mal contigo; muchas personas cargan con esto. Hablarlo con un psicólogo o psicóloga puede darte mucho alivio y herramientas. Mereces ese acompañamiento.</div></div>` : ''}
        <nav class="chips" aria-label="Secciones">${secs.map(x => `<a href="#sec-${x.id}" data-jump="${x.id}">${esc(x.name)}</a>`).join('')}</nav>
      </div>
      ${secs.map(x => x.html).join('')}
      <div class="card soft fade">
        <h3>¿Y ahora qué?</h3>
        <ol class="q">
          <li>Elige <strong>una</strong> área a trabajar y practica sus ejercicios durante dos semanas.</li>
          <li>Comparte tus resultados con tu pareja y pídele que haga su propio cuestionario.</li>
          <li>Usen la vista de comparación y la guía de conversación para hablar con calma.</li>
          <li>Repite el cuestionario en unos meses y observa qué cambió.</li>
        </ol>
        <p class="small muted">Esta herramienta no sustituye la atención psicológica profesional.</p>
      </div>
      ${shareDialog()}`;
    bindJump();
    on('#share', () => openShare(P));
    on('#print', () => doPrint());
    on('#cmp', () => { location.hash = '#comparar'; });
    on('#cmpPending', () => { const pd = store.get(PENDING_KEY); store.del(PENDING_KEY); renderCompare(S.profile, pd); });
    on('#redo', () => { if (confirm('Se borrarán tus resultados actuales de este navegador. ¿Continuar?')) { S = fresh(); save(); renderSetup(); } });
  }

  function bindJump() {
    app.querySelectorAll('[data-jump]').forEach(a => a.addEventListener('click', e => {
      e.preventDefault(); const el = document.getElementById('sec-' + a.dataset.jump);
      if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    }));
  }

  function doPrint(only) {
    const secs = app.querySelectorAll('[data-sec]');
    const opened = [];
    app.querySelectorAll('details:not([open])').forEach(d => { d.open = true; opened.push(d); });
    if (only) secs.forEach(s => { if (!only.includes(s.dataset.sec)) s.classList.add('print-hide'); });
    const cleanup = () => { secs.forEach(s => s.classList.remove('print-hide')); opened.forEach(d => d.open = false); window.removeEventListener('afterprint', cleanup); };
    window.addEventListener('afterprint', cleanup);
    setTimeout(() => { window.print(); setTimeout(cleanup, 1000); }, 50);
  }

  /* =====================================================================
     COMPARTIR
     ===================================================================== */
  function shareDialog() {
    return `<dialog id="shareDlg" aria-labelledby="shareTitle"><div class="modal-in">
      <div class="modal-head"><h2 id="shareTitle" style="margin:0">Compartir resultados</h2><button class="icon-btn" id="closeDlg" aria-label="Cerrar">✕</button></div>
      <p class="small muted">Elige qué secciones quieres incluir. Lo que compartes es información personal: compártelo solo con alguien de confianza.</p>
      <div id="shareOpts">${SECTIONS.map(x => `<label class="choice"><input type="checkbox" value="${x.id}" ${x.share ? 'checked' : ''}> ${esc(x.name)} ${x.sensitive ? '<span class="tag mid">sensible</span>' : ''}</label>`).join('')}</div>
      <p class="small muted">El enlace contiene solo los puntajes de las secciones elegidas, nunca tus respuestas a cada pregunta (salvo tus respuestas abiertas, si decides incluirlas). No se guarda en ningún servidor: la información viaja dentro del propio enlace.</p>
      <div class="row" style="margin-top:6px"><button class="btn btn-primary" id="mkLink">Crear enlace</button></div>
      <div id="linkOut" hidden>
        <div class="linkbox"><input class="input" id="linkInp" readonly aria-label="Enlace para compartir"><button class="btn btn-ghost" id="cpLink">Copiar</button></div>
        <div class="row"><a class="btn btn-ghost" id="waLink" target="_blank" rel="noopener">Enviar por WhatsApp</a><button class="btn btn-ghost" id="cpText">Copiar resumen en texto</button><button class="btn btn-ghost" id="pdfSel">PDF de lo seleccionado</button></div>
      </div>
    </div></dialog>`;
  }

  function openShare(P) {
    const dlg = document.getElementById('shareDlg');
    const sel = () => [...dlg.querySelectorAll('#shareOpts input:checked')].map(i => i.value);
    const out = dlg.querySelector('#linkOut');
    dlg.querySelector('#closeDlg').onclick = () => dlg.close();
    dlg.querySelectorAll('#shareOpts input').forEach(i => i.onchange = () => { out.hidden = true; });
    dlg.querySelector('#mkLink').onclick = () => {
      const chosen = sel(); if (!chosen.length) { toast('Elige al menos una sección'); return; }
      const url = baseUrl() + '#r=' + b64e(JSON.stringify(filterProfile(P, chosen)));
      dlg.querySelector('#linkInp').value = url;
      const msg = `${P.n ? P.n + ' quiere' : 'Quiero'} compartir contigo los resultados de su cuestionario de autoconocimiento en pareja “Lazos”. Ábrelo aquí: ${url}`;
      dlg.querySelector('#waLink').href = 'https://wa.me/?text=' + encodeURIComponent(msg);
      out.hidden = false; out.scrollIntoView({ block: 'nearest' });
    };
    dlg.querySelector('#cpLink').onclick = () => copy(dlg.querySelector('#linkInp').value);
    dlg.querySelector('#cpText').onclick = () => copy(textSummary(filterProfile(P, sel())) + '\n\n' + dlg.querySelector('#linkInp').value);
    dlg.querySelector('#pdfSel').onclick = () => { const c = sel(); dlg.close(); doPrint(c); };
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  }

  /* Deja en el perfil solo lo necesario para las secciones elegidas. */
  function filterProfile(P, chosen) {
    const F = { v: PAYLOAD_V, n: P.n, d: P.d, sec: chosen.slice(), s: {} };
    const addS = k => { if (P.s[k] != null) F.s[k] = P.s[k]; };
    if (chosen.includes('resumen')) { F.r = P.r; F.a = { A: P.a.A, V: P.a.V, st: P.a.st }; }
    if (chosen.includes('fortalezas')) { F.f = P.f; P.f.forEach(addS); }
    if (chosen.includes('trabajar')) { F.t = P.t; P.t.forEach(addS); }
    ['miedos', 'inseguridades', 'heridas', 'anhelos', 'amor', 'conflicto'].forEach(id => { if (chosen.includes(id)) SECTION_DIMS[id].forEach(addS); });
    if (chosen.includes('pareja')) { F.p = P.p; F.top = P.top; F.a = F.a || { st: P.a.st }; }
    if (chosen.includes('abiertas')) F.o = P.o;
    return F;
  }

  /* Valida un perfil recibido por enlace (dato no confiable). */
  function sanitize(raw) {
    if (!raw || typeof raw !== 'object') throw new Error('bad');
    const P = { v: raw.v, n: typeof raw.n === 'string' ? raw.n.slice(0, 40) : '', d: typeof raw.d === 'string' ? raw.d.slice(0, 10) : '', s: {}, sec: [] };
    P.sec = Array.isArray(raw.sec) ? raw.sec.filter(x => SECTIONS.some(s => s.id === x)) : [];
    if (raw.s && typeof raw.s === 'object') Object.keys(raw.s).forEach(k => { if (DIMS[k]) P.s[k] = clamp(raw.s[k]); });
    if (raw.r && typeof raw.r === 'object') { P.r = {}; RADAR_AXES.forEach(a => { if (raw.r[a.id] != null) P.r[a.id] = clamp(raw.r[a.id]); }); }
    if (raw.a && typeof raw.a === 'object') P.a = { A: raw.a.A == null ? undefined : clamp(raw.a.A), V: raw.a.V == null ? undefined : clamp(raw.a.V), st: ATTACHMENT[raw.a.st] ? raw.a.st : undefined };
    const keys = arr => Array.isArray(arr) ? arr.filter(k => DIMS[k]).slice(0, 8) : undefined;
    P.f = keys(raw.f); P.t = keys(raw.t); P.p = keys(raw.p);
    if (raw.top && typeof raw.top === 'object') P.top = { lr: LOVE[raw.top.lr] ? raw.top.lr : undefined, lg: LOVE[raw.top.lg] ? raw.top.lg : undefined, an: keys(raw.top.an) || [] };
    if (raw.o && typeof raw.o === 'object') { P.o = {}; OPEN_QUESTIONS.forEach(q => { if (typeof raw.o[q.id] === 'string') P.o[q.id] = raw.o[q.id].slice(0, 600); }); }
    return P;
  }
  function decodeCode(text) {
    text = String(text || '').trim();
    const m = text.match(/#r=([A-Za-z0-9_-]+)/); const code = m ? m[1] : (/^[A-Za-z0-9_-]+$/.test(text) ? text : null);
    if (!code) throw new Error('bad');
    return sanitize(JSON.parse(b64d(code)));
  }

  function textSummary(P) {
    const L = [];
    L.push(`💞 Resultados de ${P.n || 'mi cuestionario'} — Lazos`);
    if (P.a && P.a.st && P.sec.includes('resumen')) L.push(`\nEstilo de apego: ${ATTACHMENT[P.a.st].name}`);
    if (P.f && P.sec.includes('fortalezas')) L.push('\n🌱 Puntos fuertes:\n' + P.f.map(k => '• ' + DIMS[k].name).join('\n'));
    if (P.t && P.sec.includes('trabajar')) L.push('\n🛠️ Áreas a trabajar:\n' + P.t.map(k => '• ' + DIMS[k].name).join('\n'));
    const lst = (id, title) => { if (!P.sec.includes(id)) return; const ks = SECTION_DIMS[id].filter(k => P.s[k] != null && isConcern(k, P.s[k])); if (ks.length) L.push(`\n${title}:\n` + ks.map(k => '• ' + DIMS[k].name).join('\n')); };
    lst('miedos', '🌧️ Miedos más presentes'); lst('inseguridades', '🪞 Inseguridades'); lst('heridas', '🧵 Patrones a sanar');
    if (P.sec.includes('anhelos')) { const an = SECTION_DIMS.anhelos.filter(k => P.s[k] != null).sort((a, b) => P.s[b] - P.s[a]).slice(0, 3); if (an.length) L.push('\n✨ Lo que más anhelo: ' + an.map(k => DIMS[k].name.toLowerCase()).join(', ')); }
    if (P.sec.includes('amor')) { const r = Object.keys(LOVE).filter(k => P.s['lr_' + k] != null).sort((a, b) => P.s['lr_' + b] - P.s['lr_' + a])[0]; if (r) L.push('💞 Me siento más querido/a con: ' + LOVE[r].name.toLowerCase()); }
    if (P.sec.includes('pareja') && P.p) L.push('\n🤝 Lo que me ayuda:\n' + P.p.map(k => '• ' + DIMS[k].help).join('\n'));
    return L.join('\n');
  }

  /* =====================================================================
     VISTA DE RESULTADOS COMPARTIDOS
     ===================================================================== */
  function renderShared(code) {
    let P;
    try { P = decodeCode('#r=' + code); } catch (e) {
      app.innerHTML = `<div class="card fade"><h2>No pudimos abrir este enlace</h2><p>Puede que esté incompleto o dañado. Pide que te lo vuelvan a enviar completo.</p><button class="btn btn-primary" id="home">Ir al inicio</button></div>`;
      on('#home', () => { history.replaceState(null, '', baseUrl()); route(); }); return;
    }
    const secs = renderSections(P, false);
    const mine = S.done && S.profile;
    app.innerHTML = `
      <div class="shared-banner fade">
        <div class="eyebrow">Resultados compartidos contigo</div>
        <h1 style="margin-bottom:6px">${P.n ? 'El mapa de ' + esc(P.n) : 'Un mapa compartido contigo'}</h1>
        <p style="margin:0">${P.n ? esc(P.n) + ' eligió' : 'Esta persona eligió'} compartir esto contigo para que se conozcan mejor. Léelo con curiosidad y cariño, no como un juicio.</p>
        <div class="row" style="margin-top:14px">
          ${mine ? `<button class="btn btn-primary" id="cmpMine">Comparar con mis resultados</button>` : `<button class="btn btn-primary" id="doMine">Hacer mi propio cuestionario</button>`}
          <button class="btn btn-ghost" id="print">Guardar PDF</button>
        </div>
      </div>
      <nav class="chips" aria-label="Secciones">${secs.map(x => `<a href="#sec-${x.id}" data-jump="${x.id}">${esc(x.name)}</a>`).join('')}</nav>
      ${secs.length ? secs.map(x => x.html).join('') : '<div class="card"><p>Este enlace no incluye secciones para mostrar.</p></div>'}
      <div class="card soft fade no-print">
        <h3>¿Quieres entenderse mejor en pareja?</h3>
        <p>Haz tu propio cuestionario. Al terminar, podrás ver ambos perfiles lado a lado: dónde se complementan, dónde pueden chocar y preguntas para conversar.</p>
        ${mine ? `<button class="btn btn-primary" id="cmpMine2">Comparar con mis resultados</button>` : `<button class="btn btn-primary" id="doMine2">Hacer mi cuestionario</button>`}
      </div>
      <div class="card soft small muted">Herramienta de autoexploración, no un diagnóstico. No sustituye la atención psicológica profesional.</div>`;
    bindJump();
    const doMine = () => { store.set(PENDING_KEY, P); history.replaceState(null, '', baseUrl()); S.started ? route() : renderSetup(); };
    const cmpMine = () => { history.replaceState(null, '', baseUrl()); renderCompare(S.profile, P); };
    on('#doMine', doMine); on('#doMine2', doMine); on('#cmpMine', cmpMine); on('#cmpMine2', cmpMine);
    on('#print', () => doPrint());
  }

  /* =====================================================================
     COMPARAR
     ===================================================================== */
  function renderCompareInput() {
    const mine = S.done && S.profile;
    app.innerHTML = `<div class="card fade">
      <div class="eyebrow">Comparar</div>
      <h2>Comparar dos perfiles</h2>
      <p class="muted">Pega los enlaces de resultados de cada persona. ${mine ? 'Tus resultados ya están cargados como primera persona.' : ''}</p>
      <div class="field" style="margin-bottom:14px"><label class="lbl" for="la">Persona A</label>
        ${mine ? `<div class="choice" style="cursor:default">✓ Mis resultados${S.profile.n ? ' (' + esc(S.profile.n) + ')' : ''}</div>` : `<input class="input" id="la" placeholder="Pega aquí el enlace">`}</div>
      <div class="field" style="margin-bottom:14px"><label class="lbl" for="lb">Persona B</label><input class="input" id="lb" placeholder="Pega aquí el enlace de tu pareja"></div>
      <p id="err" class="small" style="color:var(--accent)" role="alert"></p>
      <div class="row" style="justify-content:space-between"><button class="btn-link" id="back">Volver</button><button class="btn btn-primary" id="go">Comparar</button></div>
    </div>`;
    on('#back', () => { history.replaceState(null, '', baseUrl()); route(); });
    on('#go', () => {
      try {
        const A = mine ? S.profile : decodeCode(app.querySelector('#la').value);
        const B = decodeCode(app.querySelector('#lb').value);
        history.replaceState(null, '', baseUrl());
        renderCompare(A, B);
      } catch (e) { app.querySelector('#err').textContent = 'Revisa los enlaces: alguno está incompleto o no es válido.'; }
    });
  }

  function renderCompare(A, B) {
    window.scrollTo(0, 0);
    const nA = A.n || 'Persona A', nB = B.n || 'Persona B';
    const pa = `<span class="pill-a">${esc(nA)}</span>`, pb = `<span class="pill-b">${esc(nB)}</span>`;
    const cA = 'var(--accent)', cB = 'var(--sage)';
    let html = `<div class="fade"><div class="eyebrow">Comparación</div><h1>${esc(nA)} y ${esc(nB)}</h1>
      <p class="muted">Dos personas distintas no son un problema a resolver: son dos mapas que pueden aprender a leerse. Usen esto para conversar, no para competir.</p>
      <div class="toolbar"><button class="btn btn-ghost" id="print">Guardar PDF</button><button class="btn btn-ghost" id="back">Volver</button></div></div>`;

    // Radar y apego
    if (A.r && B.r && Object.keys(A.r).length && Object.keys(B.r).length) {
      html += secWrap('resumen', 'Sus mapas, juntos', `${radarSVG([{ r: A.r, color: cA, label: nA }, { r: B.r, color: cB, label: nB }])}
        <div class="legend"><span style="--c:${cA}">${esc(nA)}</span><span style="--c:${cB}">${esc(nB)}</span></div>
        ${complementos(A, B, pa, pb)}`);
    }
    if (A.a && B.a && A.a.st && B.a.st) {
      const pts = []; if (A.a.A != null) pts.push({ A: A.a.A, V: A.a.V, color: cA, label: nA }); if (B.a.A != null) pts.push({ A: B.a.A, V: B.a.V, color: cB, label: nB });
      html += `<section class="card fade"><div class="sec-title"><span class="ic">🔗</span><h2>Sus estilos de apego</h2></div>
        <div class="att">${pts.length ? attachSVG(pts) : ''}<div>
        <p>${pa} ${esc(ATTACHMENT[A.a.st].name)} · ${pb} ${esc(ATTACHMENT[B.a.st].name)}</p>
        <p>${esc(attachPair(A.a.st, B.a.st))}</p></div></div></section>`;
    }

    // Dinámicas
    const dyn = dynamics(A, B, pa, pb);
    if (dyn.length) html += `<section class="card fade"><div class="sec-title"><span class="ic">⚖️</span><h2>Dónde pueden chocar</h2></div><p class="muted">No son sentencias, son puntos de atención para hablar a tiempo.</p>${dyn.join('')}</section>`;

    // Amor
    const lov = loveCompare(A, B, pa, pb);
    if (lov) html += `<section class="card fade"><div class="sec-title"><span class="ic">💞</span><h2>Cómo darse amor</h2></div>${lov}</section>`;

    // Anhelos
    const anh = anhelosCompare(A, B, pa, pb, cA, cB);
    if (anh) html += `<section class="card fade"><div class="sec-title"><span class="ic">✨</span><h2>Lo que anhelan</h2></div>${anh}</section>`;

    // Necesidades mutuas
    const nd = (P, pill) => (P.p || []).filter(k => DIMS[k]).map(k => `<li><span>${pill}</span><div>${esc(DIMS[k].help)}</div></li>`).join('');
    const needs = nd(A, pa) + nd(B, pb);
    if (needs) html += `<section class="card fade"><div class="sec-title"><span class="ic">🤲</span><h2>Cómo acompañarse</h2></div><p class="muted">Lo que cada quien pidió para sentirse en cuidado.</p><ul class="list-plain">${needs}</ul></section>`;

    html += `<section class="card fade"><div class="sec-title"><span class="ic">🗣️</span><h2>Guía para conversar</h2></div>
      <h3>Reglas para una conversación segura</h3><ul class="ex">${CONVO_RULES.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
      <h3 style="margin-top:18px">Preguntas para hablar juntos</h3><ol class="q">${CONVO_QUESTIONS.map(q => `<li>${esc(q)}</li>`).join('')}</ol>
      <p class="small muted">Sugerencia: elijan dos o tres preguntas por conversación. No hace falta resolverlo todo en una noche.</p></section>
      <div class="card soft small muted">La comparación usa solo las secciones que cada persona decidió compartir. Si algo no aparece, es porque una de las dos personas no lo incluyó.</div>`;
    app.innerHTML = html;
    on('#print', () => doPrint());
    on('#back', () => { history.replaceState(null, '', baseUrl()); route(); });
  }

  function complementos(A, B, pa, pb) {
    const out = [];
    RADAR_AXES.forEach(ax => {
      const a = A.r[ax.id], b = B.r[ax.id]; if (a == null || b == null) return;
      if (a >= 65 && b >= 65) out.push(`<div class="cmp-item"><strong>🌟 Fortaleza compartida: ${esc(ax.name)}</strong>Ambos tienen recursos aquí. Es un pilar de la relación.</div>`);
      else if (a >= 65 && b < 50) out.push(`<div class="cmp-item"><strong>🔄 Se complementan en: ${esc(ax.name)}</strong>${pa} puede ofrecer apoyo y ejemplo en esta área; ${pb} tiene aquí espacio para crecer, con paciencia y sin presión.</div>`);
      else if (b >= 65 && a < 50) out.push(`<div class="cmp-item"><strong>🔄 Se complementan en: ${esc(ax.name)}</strong>${pb} puede ofrecer apoyo y ejemplo en esta área; ${pa} tiene aquí espacio para crecer, con paciencia y sin presión.</div>`);
      else if (a < 45 && b < 45) out.push(`<div class="cmp-item"><strong>🌱 Reto compartido: ${esc(ax.name)}</strong>Es un área que a ambos les cuesta. Pueden trabajarla como equipo, y quizá con apoyo externo.</div>`);
    });
    return out.length ? `<h3 style="margin-top:18px">Lo que muestran sus mapas</h3>${out.join('')}` : '';
  }

  function attachPair(a, b) {
    const k = [a, b].sort().join('+');
    if (a === 'temeroso' || b === 'temeroso') return 'Una o ambas personas pueden oscilar entre buscar cercanía y alejarse. La paciencia, los acuerdos claros y la coherencia ayudan mucho; el apoyo profesional también puede marcar una gran diferencia.';
    const T = {
      'seguro+seguro': 'Ambos parten de una base segura: pueden apoyarse en ella para hablar de cualquier tema, incluso los difíciles.',
      'ansioso+seguro': 'La seguridad de una persona puede ofrecer calma a la otra. Cuiden que la persona segura no se convierta en la única que “sostiene” la relación, y que la ansiosa pueda expresar sus necesidades de forma directa.',
      'evitativo+seguro': 'La persona segura puede ofrecer cercanía sin presión, lo que ayuda a la evitativa a abrirse. Respeten los tiempos de espacio y acuerden momentos de conexión.',
      'ansioso+evitativo': 'Es una combinación muy común y desafiante: cuando una persona busca cercanía, la otra necesita espacio, y eso puede activar un ciclo de perseguir y alejarse. Reconocer ese ciclo como el “enemigo común” (y no a la persona) es el primer paso para salir de él.',
      'ansioso+ansioso': 'Ambos valoran mucho la cercanía y pueden darse mucha seguridad mutua. En momentos de estrés, sin embargo, las inseguridades pueden alimentarse entre sí: acuerden formas de calmarse juntos.',
      'evitativo+evitativo': 'Ambos respetan el espacio del otro, pero puede que los temas emocionales queden sin hablar. Programen momentos regulares para conversar de lo que sienten.'
    };
    return T[k] || '';
  }

  function dynamics(A, B, pa, pb) {
    const out = [], hi = (P, k, t = 55) => P.s && P.s[k] != null && P.s[k] >= t;
    const item = (t, d) => `<div class="cmp-item"><strong>${t}</strong>${d}</div>`;
    [[A, B, pa, pb], [B, A, pb, pa]].forEach(([X, Y, px, py]) => {
      if (hi(X, 'critica') && hi(Y, 'evasion')) out.push(item('Ciclo de queja y retirada', `Cuando ${px} expresa molestia con crítica, ${py} tiende a cerrarse; eso aumenta la frustración de ${px}. Antídoto: inicio suave de un lado, pausas acordadas del otro.`));
      if (hi(X, 'abandono') && hi(Y, 'absorcion')) out.push(item('Cercanía vs. libertad', `${px} teme perder la relación y ${py} teme perder su libertad. Lo que para uno es cuidado, para el otro puede sentirse como presión. Hablen de cuánta cercanía y cuánto espacio necesita cada quien.`));
      if (hi(X, 'comparacion') && hi(Y, 'autonomia', 70)) out.push(item('Celos y espacios propios', `${py} valora mucho sus espacios y ${px} puede sentir inseguridad con ellos. Acuerdos claros y transparencia ayudan a ambos.`));
      if (hi(X, 'exigencia') && hi(Y, 'verguenza')) out.push(item('Exigencia y sensibilidad a la crítica', `Los altos estándares de ${px} pueden tocar la herida de vergüenza de ${py}. Hablar de situaciones concretas, no de cómo es la persona, hace la diferencia.`));
    });
    if (hi(A, 'evasion') && hi(B, 'evasion')) out.push(item('Temas que se quedan sin hablar', 'Ambos tienden a evitar el conflicto. Puede parecer paz, pero los temas pendientes se acumulan. Agenden una conversación semanal de “cómo estamos”.'));
    if (hi(A, 'critica') && hi(B, 'critica')) out.push(item('Discusiones que escalan', 'Ambos tienden a la crítica cuando algo molesta. Acuerden una palabra clave para pausar y retomar con calma.'));
    if (hi(A, 'defensa') && hi(B, 'defensa')) out.push(item('Nadie se siente escuchado', 'Ambos tienden a defenderse ante una queja. Practiquen repetir lo que la otra persona dijo antes de responder.'));
    if (hi(A, 'desprecio', 50) || hi(B, 'desprecio', 50)) out.push(item('Atención al desprecio', 'El sarcasmo y la burla son el patrón más dañino según Gottman. Si aparece, conviene atenderlo pronto, y quizá con apoyo de terapia de pareja.'));
    return [...new Set(out)];
  }

  function topLove(P, pre) {
    if (P.s && Object.keys(LOVE).some(k => P.s[pre + k] != null)) return Object.keys(LOVE).filter(k => P.s[pre + k] != null).sort((a, b) => P.s[pre + b] - P.s[pre + a])[0];
    return P.top ? P.top[pre === 'lr_' ? 'lr' : 'lg'] : undefined;
  }
  function loveCompare(A, B, pa, pb) {
    const ar = topLove(A, 'lr_'), ag = topLove(A, 'lg_'), br = topLove(B, 'lr_'), bg = topLove(B, 'lg_');
    const out = [];
    if (ar) out.push(`<div class="cmp-item"><div>${pa} se siente más amado o amada con <strong>${esc(LOVE[ar].receive)}</strong>.${bg ? (bg === ar ? ` ¡Y es justo como ${pb} suele dar amor!` : ` ${pb} suele dar amor con ${esc(LOVE[bg].name.toLowerCase())}: vale la pena que también practique ${esc(LOVE[ar].name.toLowerCase())}.`) : ''}</div><div class="small muted" style="margin-top:6px">Idea: ${esc(LOVE[ar].help)}</div></div>`);
    if (br) out.push(`<div class="cmp-item"><div>${pb} se siente más amado o amada con <strong>${esc(LOVE[br].receive)}</strong>.${ag ? (ag === br ? ` ¡Y es justo como ${pa} suele dar amor!` : ` ${pa} suele dar amor con ${esc(LOVE[ag].name.toLowerCase())}: vale la pena que también practique ${esc(LOVE[br].name.toLowerCase())}.`) : ''}</div><div class="small muted" style="margin-top:6px">Idea: ${esc(LOVE[br].help)}</div></div>`);
    return ar && br ? out.join('') : '';
  }

  function anhelosCompare(A, B, pa, pb, cA, cB) {
    const keys = SECTION_DIMS.anhelos.filter(k => A.s && B.s && A.s[k] != null && B.s[k] != null);
    if (!keys.length) return '';
    const both = keys.filter(k => A.s[k] >= 75 && B.s[k] >= 75).map(k => DIMS[k].name.toLowerCase());
    const gaps = keys.filter(k => Math.abs(A.s[k] - B.s[k]) >= 40);
    return `${keys.map(k => `<div class="dim"><div class="dim-h"><strong>${esc(DIMS[k].name)}</strong><span class="small muted">${A.s[k]} · ${B.s[k]}</span></div>
        <div class="bar" aria-hidden="true"><div style="width:${Math.max(3, A.s[k])}%;background:${cA}"></div></div><div class="bar b2" aria-hidden="true"><div style="width:${Math.max(3, B.s[k])}%;background:${cB}"></div></div></div>`).join('')}
      <div class="legend"><span style="--c:${cA}">${pa}</span><span style="--c:${cB}">${pb}</span></div>
      ${both.length ? `<div class="cmp-item" style="margin-top:12px"><strong>🌟 Lo que ambos anhelan</strong>${esc(both.join(', '))}. Es terreno fértil para construir juntos.</div>` : ''}
      ${gaps.map(k => `<div class="cmp-item"><strong>💬 Para conversar: ${esc(DIMS[k].name)}</strong>${A.s[k] > B.s[k] ? pa : pb} lo valora bastante más que ${A.s[k] > B.s[k] ? pb : pa}. No es incompatible, pero conviene hablar de qué significa para cada quien y cómo pueden honrarlo.</div>`).join('')}`;
  }

  window.addEventListener('beforeprint', () => app.querySelectorAll('details').forEach(d => d.open = true));

  route();
})();

</script>
</body>
</html>
